<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FounderGate — LRCQ Run States</title>
<link rel="stylesheet" href="./console.css" />
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <div class="brand">FounderGate</div>
  <div class="witness-flag" role="note">LRCQ run states — witness candidate, not an accepted product surface</div>
  <div class="run-id">run <span id="run-id">—</span></div>
</header>
<main id="main" tabindex="-1">
  <div id="founder-banner" class="banner" role="alert" aria-live="assertive" hidden>
    <strong>Founder action required</strong> — <span id="fa-count"></span> state(s) are HELD for reconciliation and will not auto-retry.
  </div>
  <section class="card" aria-labelledby="stmt-h"><h2 id="stmt-h">Governing statements</h2>
    <ul class="small" id="statements"></ul></section>
  <section class="card" aria-labelledby="states-h"><h2 id="states-h">The ten run states</h2>
    <ul id="state-list" class="states" aria-describedby="states-h"></ul>
  </section>
</main>
<script src="./run-states.js"></script>
</body>
</html>
