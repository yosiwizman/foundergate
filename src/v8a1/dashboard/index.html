<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FounderGate — Truth Dashboard (V8-A1)</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body id="top">
    <div class="app">
      <!-- Friendly sidebar -->
      <aside class="sidebar">
        <div class="brand" id="brand">FounderGate</div>
        <nav class="nav" id="home-nav"></nav>
        <div class="sidebar-spacer"></div>
        <div class="robot-card">
          <div class="robot-emoji">🤖</div>
          <p class="robot-line" id="robot-line"></p>
          <a class="robot-btn" id="robot-btn" href="#">Ask Now</a>
        </div>
        <div class="demo-pill" id="demo-pill"></div>
      </aside>

      <!-- Main content -->
      <main class="content">
        <!-- Top bar -->
        <header class="topbar">
          <div>
            <h1 id="hi">Hi there! 👋</h1>
            <p class="subtitle" id="subtitle"></p>
          </div>
          <div class="topbar-actions">
            <a class="btn-ghost" id="get-help" href="#">❓ Get Help</a>
            <button class="btn-pause" id="pause-button" type="button">⏸ Pause &amp; get help</button>
          </div>
        </header>
        <p id="pause-scope" class="pause-scope" hidden></p>

        <!-- F1: plain-language project summary -->
        <section class="summary-card" id="summary-card"></section>

        <!-- Status strip -->
        <section class="card status-strip">
          <div class="strip-head"><b id="status-label">Project Status</b> <span class="state-pretty" id="state-pretty"></span></div>
          <div class="chips-row" id="status-chips"></div>
        </section>

        <!-- Main row -->
        <div class="mainrow">
          <section class="card waiting" id="waiting">
            <h2 id="waiting-title">⭐ Waiting for You</h2>
            <p class="lead" id="waiting-lead"></p>
            <div class="gate-box">
              <div class="gate-art" aria-hidden="true">🚧</div>
              <div>
                <div class="gate-title" id="gate-title"></div>
                <p class="gate-desc" id="gate-desc"></p>
                <a class="btn-primary" id="read-decision" href="#waiting">Read the Decision</a>
              </div>
            </div>
            <p class="note" id="waiting-note"></p>
          </section>

          <section class="card activity">
            <h2 id="activity-title">🕐 What Happened Recently</h2>
            <ul class="feed" id="activity-feed"></ul>
          </section>
        </div>

        <!-- Quick tiles -->
        <section class="card">
          <h2 class="tiles-title">Quick Things You Can Do</h2>
          <div class="tiles" id="tiles"></div>
        </section>

        <!-- Don't change these -->
        <section class="card protect" id="do-not-touch">
          <h2><span class="protect-icon" aria-hidden="true">🔒</span> <span id="dnt-title">Please Don't Change These (Important!)</span></h2>
          <p class="hint" id="dnt-subtitle"></p>
          <ul id="do-not-touch-list"></ul>
        </section>

        <!-- Bottom three cards -->
        <div class="bottomrow">
          <section class="card safe-card">
            <h2 id="safe-title">🛡 Is It Safe?</h2>
            <ul class="checklist" id="safe-lines"></ul>
            <p class="verdict" id="safe-verdict"></p>
          </section>

          <section class="card pause-card">
            <h2 id="pausecard-title">⏸ Can I Pause It?</h2>
            <p id="pausecard-lead"></p>
            <button class="btn-pause wide" id="pause-button-2" type="button">⏸ Pause &amp; get help</button>
            <p class="info-note" id="pausecard-note"></p>
          </section>

          <section class="card cost-card" id="cost-card">
            <h2 id="cost-title">💲 How Much Does It Cost?</h2>
            <p id="cost-lead"></p>
            <div class="cost-big" id="cost-big">—</div>
            <div class="cost-per" id="cost-per"></div>
            <div class="cost-badge" id="cost-disclaimer"></div>
            <p class="hint" id="cost-note"></p>
          </section>
        </div>

        <!-- Footer -->
        <p class="home-footer" id="home-footer"></p>
      </main>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
